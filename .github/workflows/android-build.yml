# PR 을 올리면 GitHub 가 자동으로 앱을 빌드해 본다. 빨간 X 가 뜨면 빌드가 깨진 것이니 Merge 하지 않는다.
name: Android 빌드

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 빌드
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: APK 보관 (Actions 탭에서 받을 수 있음, 7일)
        uses: actions/upload-artifact@v4
        with:
          name: merrycri-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
