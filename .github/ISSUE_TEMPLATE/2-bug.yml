name: 버그 (FIX)
description: 앱이 죽거나 이상하게 동작할 때
title: "FIX: [A] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일 / 재현 방법
      placeholder: |
        라운지에서 광장으로 나와도 라운지 인원 수가 줄지 않는다
        1. AVD 두 대로 라운지 입장 → 2. 한 대만 '광장으로'
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Logcat / 스크린샷 (있으면)
      render: text
